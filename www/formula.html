<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>公式演示 - 3D 虚拟魔方</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; display: flex; }
        #canvas-container { flex: 1; height: 100vh; position: relative; }
        
        /* 【核心修改】公式信息区改为左上角紧凑卡片，与 index 的打乱框风格一致 */
        #top-info {
            position: absolute; 
            top: 0; 
            left: 0; 
            transform: none;
            background: rgba(255, 255, 255, 0.95); 
            padding: 8px 15px; 
            border-radius: 0 0 10px 0; /* 右下角圆角 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            text-align: left; 
            pointer-events: none; 
            z-index: 10; 
            max-width: 100vw;
        }
        #top-info h2 { 
            margin: 0 0 4px 0; 
            font-size: 14px; /* 标题缩小到 14px */
            color: #333; 
        }
        .formula-line { 
            font-size: 14px; /* 公式字体缩小到 14px */
            margin: 0; 
            font-family: monospace; 
            line-height: 1.4; 
            letter-spacing: 0.5px;
        }
        .formula-label { color: #333; font-weight: bold; font-family: sans-serif; }
        #forwardFormula { color: #2196F3; font-weight: bold; }

        /* 底部按钮区 */
        #ui {
            position: absolute; bottom: 30px; width: 100%; left: 0; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
        }
        .controls-row { display: flex; gap: 10px; pointer-events: auto; }
        button { padding: 10px 20px; font-size: 15px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background: #fff; transition: background 0.2s; font-weight: bold;}
        button:hover { background: #e0e0e0; }
        #playBtn { background:#4CAF50; color:white; border-color:#4CAF50; }
        #playBtn:hover { background:#45a049; }
        #pauseBtn { background:#fff; color:#333; border-color:#ccc; }
        #resetBtn { background:#fff; color:#333; border-color:#ccc; }

        /* 右侧边栏 */
        #sidebar {
            width: 250px; height: 100vh; background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; z-index: 20;
        }
        #sidebar h3 { margin: 0 0 15px 0; color: #333; font-size: 18px; }
        .sidebar-btn {
            display: block; padding: 12px; margin-bottom: 8px; background: #f5f5f5; color: #333;
            text-decoration: none; border-radius: 6px; text-align: center; font-size: 15px;
            transition: all 0.2s; border: 1px solid #ddd; font-weight: bold;
        }
        .sidebar-btn:hover { background: #e0e0e0; }
        .sidebar-btn.active { background: #2196F3; color: white; border-color: #2196F3; }
        .sidebar-back { margin-top: auto; background: #9E9E9E; color: white; border-color: #9E9E9E; }
        .sidebar-back:hover { background: #757575; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- 左侧 3D 渲染区 -->
    <div id="canvas-container">
        <!-- 顶部公式信息（已改为左上角紧凑版） -->
        <div id="top-info">
            <h2 id="formulaTitle">公式演示</h2>
            <p class="formula-line"><span class="formula-label">公式：</span><span id="forwardFormula"></span></p>
        </div>
        <div id="ui">
            <div class="controls-row">
                <button id="playBtn">正放演示</button>
                <button id="pauseBtn">暂停</button>
                <button id="resetBtn">重置魔方</button>
            </div>
        </div>
    </div>

    <!-- 右侧边栏 -->
    <div id="sidebar">
        <h3 id="sidebarTitle">其他公式</h3>
        <div id="sidebarList" style="flex: 1; overflow-y: auto; padding-right: 5px;"></div>
        <a href="index.html" class="sidebar-btn sidebar-back">返回主页</a>
    </div>

    <script src="js/data.js"></script>
    <script type="module" src="js/formula.js"></script>
</body>
</html>
