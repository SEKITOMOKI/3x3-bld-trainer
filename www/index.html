<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>三阶盲拧新手练习平台</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 WCA 官方打乱生成库 (如果本地已完全取代，可保持注释) -->
    <!-- <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script> -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div class="app-container">
        <!-- 左侧编码练习区 -->
        <main class="practice-area">
            <div id="canvas-container">
                <!-- 打乱公式显示区 -->
                <div id="scramble-display"
                    style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.95); padding: 12px 24px; border-radius: 10px; font-family: monospace; font-size: 18px; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.1); pointer-events: none; z-index: 10; display: none; text-align: center; max-width: 90%;">
                    <span id="scrambleText">等待打乱...</span>
                </div>
            </div>
            
            <!-- 【修复】删除了重复嵌套的 <div id="ui">，确保按钮定位正确 -->
            <div id="ui">
                <div class="controls-row">
                    <button id="toggleLetterBtn" class="btn-green">显示编码</button>
                    <button id="scrambleBtn" class="btn-blue">打乱</button>
                    <button id="focusCornerBtn" class="btn-purple">角块</button>
                    <button id="focusEdgeBtn" class="btn-orange">棱块</button>
                    <button id="resetBtn">复原</button>
                    <button id="toggleCubeBtn">隐藏</button>
                </div>
            </div>
        </main>

        <!-- 拖拽条，用于调整侧边栏宽度 -->
        <div class="resizer" id="dragMe"></div>

        <!-- 右侧导航菜单与笔记区 -->
        <aside class="sidebar">
            <!-- <h1>三阶盲拧<br>新手练习平台</h1> -->
            <div class="menu-list">
                <a href="category.html?type=corner" class="menu-btn">角块公式 <span>18条</span></a>
                <a href="category.html?type=edge" class="menu-btn">棱块公式 <span>8条</span></a>
                <a href="category.html?type=flip" class="menu-btn">翻色公式</a>
                <a href="category.html?type=parity" class="menu-btn">奇偶校验公式</a>
            </div>

            <!-- 当前打乱编码笔记面板 -->
            <div class="note-panel">
                <h3>📝 当前打乱编码记录本</h3>
                <div class="note-item">
                    <label for="noteCorner">角:</label>
                    <textarea id="noteCorner" placeholder="例如: AB CD EF"></textarea>
                </div>
                <div class="note-item">
                    <label for="noteEdge">棱:</label>
                    <textarea id="noteEdge" placeholder="例如: GH IJ KL"></textarea>
                </div>
                <div class="note-item">
                    <label for="noteFlip">翻色:</label>
                    <textarea id="noteFlip" placeholder="例如: 角黄绿红逆 棱黄绿翻"></textarea>
                </div>
            </div>

            <!-- 个人联想词库面板 -->
            <details class="wordlist-panel">
                <summary>📖 个人联想词库</summary>
                <div class="wl-tools">
                    <input id="assocSearch" type="text" placeholder="搜索字母组合或联想词..." autocomplete="off">
                </div>
                <div class="wl-grid" id="assocGrid"></div>
                <div class="wl-footer">
                    <button id="assocExportBtn">导出备份</button>
                    <button id="assocImportBtn">导入备份</button>
                </div>
                <div class="wl-format-tip">支持导入/导出 JSON 格式文件 (.json)</div>
            </details>
        </aside>

        <!-- 【新增】书签按钮（必须在 sidebar 外面，当 sidebar 隐藏时它依然可见可点击） -->
        <div id="sidebarHandle"
            style="display: none; position: fixed; right: 0; top: 50%; transform: translateY(-50%); background: #2196F3; color: white; padding: 15px 8px; border-radius: 10px 0 0 10px; cursor: pointer; z-index: 1000; font-size: 13px; font-weight: bold; box-shadow: -2px 0 8px rgba(0,0,0,0.2); writing-mode: vertical-rl; letter-spacing: 2px; transition: all 0.2s;">
            工具</div>
    </div>

    <!-- 引入主要逻辑（3D魔方与打乱） -->
    <script type="module" src="js/main.js"></script>
    <!-- 引入联想词库逻辑 -->
    <script src="js/assoc.js"></script>
</body>

</html>
