<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>三阶盲拧彳亍法新手练习平台</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 WCA 官方打乱生成库 (如果本地已完全取代，可保持注释) -->
    <!-- <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script> -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
        
    </script>
    <style>
        /* 【修改】侧边栏顶部标题区样式：放大字体 */
        .sidebar-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .sidebar-header h1 {
            margin: 0 0 12px 0;
            font-size: 22px;
            line-height: 1.5;
            font-weight: bold;
        }

        .sidebar-header h1 .title-link {
            color: #333;
            text-decoration: none;
            transition: color 0.2s, opacity 0.2s;
            display: inline-block;
            cursor: pointer;
        }

        .sidebar-header h1 .title-link:hover {
            color: #2196F3;
        }

        .sidebar-header h1 .title-link:active {
            opacity: 0.75;
        }

        @media (max-width: 1200px) {
            .sidebar-header h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- 左侧编码练习区 -->
        <main class="practice-area">
            <div id="canvas-container">
                <!-- 打乱公式显示区 -->
                <div id="scramble-display"
                    style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.95); padding: 12px 24px; border-radius: 10px; font-family: monospace; font-size: 18px; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.1); pointer-events: none; z-index: 10; display: none; text-align: center; max-width: 90%;">
                    <span id="scrambleText">等待打乱...</span>
                </div>
            </div>

            <div id="ui">
                <div class="controls-row">
                    <button id="toggleLetterBtn" class="btn-green">显示编码</button>
                    <button id="scrambleBtn" class="btn-blue">打乱</button>
                    <button id="focusCornerBtn" class="btn-purple">角块</button>
                    <button id="focusEdgeBtn" class="btn-orange">棱块</button>
                    <button id="resetBtn">复原</button>
                    <button id="toggleCubeBtn">隐藏</button>
                </div>
            </div>
        </main>

        <!-- 拖拽条，用于调整侧边栏宽度 -->
        <div class="resizer" id="dragMe"></div>

        <!-- 右侧导航菜单与笔记区 -->
        <aside class="sidebar">
            <!-- 【新增】平台标题与作者署名 -->
            <div class="sidebar-header">
                <h1>
                    <a href="https://github.com/SEKITOMOKI/3x3-bld-trainer" target="_blank" rel="noopener noreferrer"
                        class="title-link" title="访问 GitHub 仓库">
                        三阶盲拧彳亍法<br>新手练习平台
                    </a>
                </h1>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换深色 / 浅色主题">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                    </svg>
                </button>
            </div>

            <div class="menu-list">
                <!-- 公式按钮 -->
                <a href="category.html?type=menu" class="menu-btn">公式</a>
                <!-- 记忆训练按钮 -->
                <a href="memory.html" class="menu-btn">记忆训练</a>
                <a href="speed-association.html" class="menu-btn">速刷联想词</a>
            </div>

            <!-- 当前打乱编码笔记面板 -->
            <div class="note-panel">
                <h3>📝 当前打乱编码记录本</h3>
                <div class="note-item">
                    <label for="noteCorner">角:</label>
                    <textarea id="noteCorner" placeholder="例如: AB CD EF"></textarea>
                </div>
                <div class="note-item">
                    <label for="noteEdge">棱:</label>
                    <textarea id="noteEdge" placeholder="例如: GH IJ KL"></textarea>
                </div>
                <div class="note-item">
                    <label for="noteFlip">翻色:</label>
                    <textarea id="noteFlip" placeholder="例如: 角黄绿红逆 棱黄绿翻"></textarea>
                </div>
            </div>

            <!-- 个人联想词库面板 -->
            <details class="wordlist-panel">
                <summary>📖 个人联想词库</summary>
                <div class="wl-tools">
                    <input id="assocSearch" type="text" placeholder="搜索字母组合或联想词..." autocomplete="off">
                    <!-- 【新增】添加新联想词按钮 -->
                    <button id="assocAddBtn"
                        style="margin-top: 8px; width: 100%; padding: 8px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">+
                        新增联想词</button>
                </div>
                <div class="wl-grid" id="assocGrid"></div>
                <div class="wl-footer">
                    <button id="assocExportBtn">导出备份</button>
                    <button id="assocImportBtn">导入备份</button>
                </div>
                <div class="wl-format-tip">支持导入/导出 JSON 格式文件 (.json)</div>
            </details>
        </aside>

        <!-- 书签按钮（必须在 sidebar 外面，当 sidebar 隐藏时它依然可见可点击） -->
        <div id="sidebarHandle"
            style="display: none; position: fixed; right: 0; top: 50%; transform: translateY(-50%); background: #2196F3; color: white; padding: 15px 8px; border-radius: 10px 0 0 10px; cursor: pointer; z-index: 1000; font-size: 13px; font-weight: bold; box-shadow: -2px 0 8px rgba(0,0,0,0.2); writing-mode: vertical-rl; letter-spacing: 2px; transition: all 0.2s;">
            工具</div>
    </div>

    <!-- 引入主要逻辑（3D魔方与打乱） -->
    <script type="module" src="js/main.js"></script>
    <!-- 引入联想词库逻辑 -->
    <script src="js/assoc.js"></script>
</body>

</html>
