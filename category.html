<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>公式列表</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #f0f0f0; margin: 0; font-family: sans-serif; padding-top: 50px; }
        .header { display: flex; justify-content: space-between; width: 80%; max-width: 800px; margin-bottom: 30px; }
        .back-btn { text-decoration: none; color: #2196F3; font-weight: bold; font-size: 18px; }
        h1 { margin: 0; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; width: 80%; max-width: 800px; }
        .formula-btn {
            padding: 15px; background: white; border: 2px solid #2196F3; border-radius: 8px;
            text-align: center; text-decoration: none; color: #2196F3; font-weight: bold; font-size: 18px;
            transition: all 0.2s;
        }
        .formula-btn:hover { background: #2196F3; color: white; }
        .empty-tip { color: #888; font-size: 18px; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">← 返回主目录</a>
        <h1 id="pageTitle">公式列表</h1>
    </div>
    <div id="formulaGrid" class="grid"></div>
    <div id="emptyTip" class="empty-tip" style="display: none;">该模块暂无公式数据，请在 data.js 中补充。</div>

    <script src="js/data.js"></script>
    <script>
        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'corner';
        const category = formulaData[type];

        const pageTitle = document.getElementById('pageTitle');
        const grid = document.getElementById('formulaGrid');
        const emptyTip = document.getElementById('emptyTip');

        if (category) {
            pageTitle.textContent = category.name;
            if (category.list.length === 0) {
                emptyTip.style.display = 'block';
            } else {
                // 按 group 分组
                const groups = {};
                category.list.forEach(item => {
                    const groupName = item.group || '其他公式';
                    if (!groups[groupName]) groups[groupName] = [];
                    groups[groupName].push(item);
                });

                // 渲染每个分组
                for (const [groupName, items] of Object.entries(groups)) {
                    // 分组标题
                    const groupTitle = document.createElement('h3');
                    groupTitle.textContent = groupName;
                    groupTitle.style.gridColumn = '1 / -1'; // 跨越整行
                    groupTitle.style.marginTop = '20px';
                    groupTitle.style.marginBottom = '10px';
                    groupTitle.style.color = '#333';
                    groupTitle.style.fontSize = '18px';
                    grid.appendChild(groupTitle);

                    // 分组内的公式按钮
                    items.forEach(item => {
                        const a = document.createElement('a');
                        a.href = `formula.html?type=${type}&id=${item.id}`;
                        a.className = 'formula-btn';
                        a.textContent = item.name;
                        grid.appendChild(a);
                    });
                }
            }
        } else {
            pageTitle.textContent = '未知模块';
        }

    </script>
</body>
</html>
